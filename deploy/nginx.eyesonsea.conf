# /etc/nginx/sites-available/eyesonsea.conf
# Mirrors liveaboard.conf (sibling site on the same VPS). Upstream = compose service on 127.0.0.1:3070.

server {
    listen 80;
    server_name eyesonsea.mermates.club;

    # Let certbot answer HTTP-01 challenges (Cloudflare proxies /.well-known over HTTP).
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name eyesonsea.mermates.club;

    ssl_certificate     /etc/letsencrypt/live/eyesonsea.mermates.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eyesonsea.mermates.club/privkey.pem;
    include snippets/ssl.conf;

    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        include snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
